name: Build Windows desktop application

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/desktop-gui-cross-platform
      - feature/windows-installer
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-gui.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test GUI imports
        run: python -c "import gui; print('Watchdog IDS GUI import OK')"
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --windowed --name WatchdogIDS gui.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler /Oinstaller-output /FWatchdogIDS-Setup installer/WatchdogIDS.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
      - name: Upload Windows application folder
        uses: actions/upload-artifact@v4
        with:
          name: WatchdogIDS-windows-x64-portable
          path: dist/WatchdogIDS/
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WatchdogIDS-windows-x64-setup
          path: installer-output/WatchdogIDS-Setup.exe
      - name: Publish Windows release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/WatchdogIDS-Setup.exe
            dist/WatchdogIDS/WatchdogIDS.exe
